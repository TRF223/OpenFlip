<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f28c28">
<link rel="icon" href="logo.jpg" type="image/jpeg"><link rel="apple-touch-icon" href="logo.jpg"><title>OpenFlip</title>
<style>
:root{--bg:#e9e9ec;--panel:#fff;--ink:#1f1f24;--muted:#5b5b67;--line:#c4c4cd;--accent:#c2410c;--bar:#f28c28;--paper:#fbfaf3;box-sizing:border-box;font:16px/1.45 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit;color:inherit}button{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:7px 12px;min-height:40px;cursor:pointer}button:hover{border-color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}button.primary,.selected{background:var(--accent);border-color:var(--accent);color:white}.app{max-width:960px;margin:auto;padding:14px;display:grid;gap:14px}header,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}header{background:var(--bar);display:flex;flex-wrap:wrap;align-items:center;gap:10px}h1{font-size:27px;margin:0 auto 0 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.controls{flex-basis:100%}#workspace{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px}#tools{display:grid;align-content:start;gap:8px}#tools label{font-weight:700;color:var(--muted)}.swatches{display:flex;flex-wrap:wrap;gap:8px}.swatch{width:36px;height:36px;padding:0;border-radius:50%}.swatch.selected{outline:3px solid #1d4ed8;outline-offset:2px}#colorPicker{width:44px;height:40px;padding:2px}#canvasWrap{width:min(100%,640px);aspect-ratio:4/3;position:relative;margin:auto;border:3px solid var(--ink);background:var(--paper);overflow:hidden;touch-action:none}body.playing #canvasWrap{touch-action:pan-y}#canvasWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}.timeline{display:flex;gap:8px;overflow-x:auto;padding:8px;background:var(--bg);border-radius:8px}.frame-thumb{position:relative;flex:0 0 auto;padding:2px}.frame-thumb canvas{display:block;width:80px;height:60px;image-rendering:pixelated}.frame-thumb span{position:absolute;bottom:2px;left:4px;background:#fffd;color:#111;font-size:12px;padding:0 4px}.frame-thumb.current{outline:3px solid var(--accent)}input[type=range]{accent-color:var(--accent)}.hint{color:var(--muted);font-size:14px}.sound-item,.project-item{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:8px 0}.sound-item strong,.project-item strong{flex:1;overflow-wrap:anywhere}.sound-list,.library-list{margin-top:8px}#status{min-height:1.5em;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;z-index:5;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}.dialog{width:min(600px,100%);max-height:90dvh;overflow:auto;background:var(--panel);padding:16px;border:1px solid var(--line);border-radius:10px}.dialog h2{margin-top:0}@media(max-width:700px){.app{padding:8px}#workspace{grid-template-columns:1fr}#tools{grid-template-columns:1fr 2fr;align-items:center}.swatch{width:42px;height:42px}}
</style>
</head>
<body><main class="app">
<header><h1>OpenFlip</h1><div class="row"><button id="undo">Undo</button><button id="play" class="primary">Play</button><label>FPS <select id="fps"><option>1</option><option>2</option><option>4</option><option selected>6</option><option>8</option><option>12</option><option>24</option></select></label><button id="loop" aria-pressed="false">Loop: Off</button><button id="exportFrame">Export frame PNG</button></div></header>
<section id="workspace"><aside id="tools" class="panel"><label>Tool</label><div class="row"><button data-tool="pen" class="primary">Pen</button><button data-tool="eraser">Eraser</button><button data-tool="fill">Fill</button></div><label>Color</label><div id="swatches" class="swatches"></div><label for="colorPicker">Custom color</label><input id="colorPicker" type="color" value="#141414" aria-label="Custom drawing color"><label for="brushSize">Brush size</label><select id="brushSize"><option>1</option><option selected>2</option><option>4</option><option>8</option></select><label>Layer</label><div class="row"><button data-layer="0" class="primary">1</button><button data-layer="1">2</button></div><label><input id="onion" type="checkbox" checked> Previous-frame guide</label></aside>
<div><div id="canvasWrap" aria-label="Flipnote drawing canvas"><canvas id="art0" width="256" height="192"></canvas><canvas id="art1" width="256" height="192"></canvas><canvas id="ghost" width="256" height="192" aria-hidden="true"></canvas></div><p id="status" role="status">Draw on the canvas or create a frame.</p></div></section>
<section class="panel"><div class="row"><strong style="margin-right:auto">Frames <span id="frameCount"></span></strong><button id="addFrame">+ New</button><button id="duplicateFrame">Duplicate</button><button id="clearFrame">Clear</button><button id="deleteFrame">Delete</button></div><div id="timeline" class="timeline" role="list"></div><div class="row" style="margin-top:10px"><button id="saveProject" class="primary">Save project to library</button><button id="openLibrary">Project library</button><button id="newProject">New project</button><button id="downloadProject">Export project</button><label>Import project <input id="importProject" type="file" accept="application/json,.json"></label></div><p class="hint">Projects are saved in this browser on this device. Export JSON to move projects to another device.</p></section>
<section class="panel"><strong>Sound library</strong><p class="hint">Import or record a voice clip, attach it to the selected frame, and delete sounds you no longer need.</p><div class="row"><label>Import audio <input id="audioFile" type="file" accept="audio/*"></label><button id="recordVoice">Record voice</button><button id="stopRecord" disabled>Stop recording</button><span id="recordStatus" class="hint"></span></div><div id="soundList" class="sound-list"></div></section>
</main><div id="libraryModal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="libraryTitle"><div class="row"><h2 id="libraryTitle" style="margin-right:auto">Project library</h2><button id="closeLibrary">Close</button></div><div id="libraryList" class="library-list"></div></section></div>
<script>
'use strict';
const W=256,H=192,$=s=>document.querySelector(s),uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const PALETTE=['#141414','#e0245e','#2a5bd7','#f6f6f1','#f28c28','#48a868','#8c52ff','#ffffff'];
const canvases=[$('#art0'),$('#art1')],contexts=canvases.map(c=>c.getContext('2d')),ghost=$('#ghost').getContext('2d');
function newFrame(){const a=document.createElement('canvas'),b=document.createElement('canvas');a.width=b.width=W;a.height=b.height=H;return{layers:[a,b],soundId:null}}
let frames=[newFrame()],current=0,layer=0,color=PALETTE[0],tool='pen',size=2,loop=false,playing=false,timer=null,undoStack=[],drawing=false,lastPoint=null,sounds=[],recorder=null,recordChunks=[],projectName='Untitled project',activeProjectId=null;
function status(s){$('#status').textContent=s}function ctx(){return frames[current].layers[layer].getContext('2d')}
function snapshot(){undoStack.push({frame:current,layer,data:ctx().getImageData(0,0,W,H)});if(undoStack.length>40)undoStack.shift()}
function render(){contexts.forEach((c,i)=>{c.clearRect(0,0,W,H);c.drawImage(frames[current].layers[i],0,0)});ghost.clearRect(0,0,W,H);if($('#onion').checked&&current>0)frames[current-1].layers.forEach(c=>ghost.drawImage(c,0,0));$('#frameCount').textContent=`${current+1} / ${frames.length}`;drawTimeline()}
function drawTimeline(){const list=$('#timeline');list.replaceChildren();frames.forEach((f,i)=>{const b=document.createElement('button');b.className='frame-thumb'+(i===current?' current':'');b.setAttribute('aria-label',`Frame ${i+1}`);const c=document.createElement('canvas');c.width=80;c.height=60;const x=c.getContext('2d');x.fillStyle='#fbfaf3';x.fillRect(0,0,80,60);f.layers.forEach(l=>x.drawImage(l,0,0,80,60));const n=document.createElement('span');n.textContent=i+1;b.append(c,n);b.onclick=()=>{stopPlayback();current=i;render()};list.append(b)})}
function point(e){const r=$('#canvasWrap').getBoundingClientRect();return[Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)*W/r.width))),Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)*H/r.height)))]}
function stamp(x,y){const c=ctx(),o=Math.floor(size/2);if(tool==='eraser')c.clearRect(x-o,y-o,size,size);else{c.fillStyle=color;c.fillRect(x-o,y-o,size,size)}}
function stroke(a,b){let[x,y]=a,[x1,y1]=b;const dx=Math.abs(x1-x),sx=x<x1?1:-1,dy=-Math.abs(y1-y),sy=y<y1?1:-1;let err=dx+dy;for(;;){stamp(x,y);if(x===x1&&y===y1)break;const e=2*err;if(e>=dy){err+=dy;x+=sx}if(e<=dx){err+=dx;y+=sy}}}
function fillAt(x,y){const c=ctx(),img=c.getImageData(0,0,W,H),d=img.data,i0=(y*W+x)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],n=[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16),255];if(t.every((v,i)=>v===n[i]))return;const match=i=>d[i]===t[0]&&d[i+1]===t[1]&&d[i+2]===t[2]&&d[i+3]===t[3],stack=[[x,y]];while(stack.length){const[px,py]=stack.pop(),i=(py*W+px)*4;if(!match(i))continue;let l=px,r=px;while(l>0&&match((py*W+l-1)*4))l--;while(r<W-1&&match((py*W+r+1)*4))r++;for(let k=l;k<=r;k++){const j=(py*W+k)*4;d[j]=n[0];d[j+1]=n[1];d[j+2]=n[2];d[j+3]=255;if(py>0&&match(((py-1)*W+k)*4))stack.push([k,py-1]);if(py<H-1&&match(((py+1)*W+k)*4))stack.push([k,py+1])}}c.putImageData(img,0,0)}
function saveDraft(){try{localStorage.setItem('openflip-draft-v1',JSON.stringify(projectData()))}catch{status('Device storage is full. Export a project backup.')}}
const wrap=$('#canvasWrap');
wrap.addEventListener('pointerdown',e=>{if(playing){stopPlayback();return}if(e.pointerType==='touch')wrap.setPointerCapture(e.pointerId);drawing=true;snapshot();const p=point(e);if(tool==='fill'){fillAt(...p);drawing=false;render();saveDraft();return}lastPoint=p;stamp(...p);render()});
wrap.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);stroke(lastPoint,p);lastPoint=p;render()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])wrap.addEventListener(ev,()=>{if(!drawing)return;drawing=false;lastPoint=null;render();saveDraft()});
function setColor(c){color=c;$('#colorPicker').value=c;document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('selected',b.dataset.color.toLowerCase()===c.toLowerCase()))}
PALETTE.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.dataset.color=c;b.style.background=c;b.setAttribute('aria-label',`Choose ${c}`);b.onclick=()=>setColor(c);$('#swatches').append(b)});setColor(color);$('#colorPicker').oninput=e=>setColor(e.target.value);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('primary',x===b))});document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{layer=Number(b.dataset.layer);document.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('primary',x===b))});$('#brushSize').onchange=e=>size=Number(e.target.value);$('#onion').onchange=render;
$('#undo').onclick=()=>{const u=undoStack.pop();if(!u)return;current=u.frame;layer=u.layer;frames[current].layers[layer].getContext('2d').putImageData(u.data,0,0);render();saveDraft()};
function stopPlayback(){playing=false;document.body.classList.remove('playing');clearTimeout(timer);$('#play').textContent='Play';$('#play').classList.add('primary')}
function playTick(){render();const sound=sounds.find(s=>s.id===frames[current].soundId);if(sound?.data)new Audio(sound.data).play().catch(()=>{});timer=setTimeout(()=>{if(!playing)return;if(current<frames.length-1)current++;else if(loop)current=0;else{stopPlayback();return}playTick()},1000/Number($('#fps').value))}
$('#play').onclick=()=>{if(playing){stopPlayback();return}playing=true;document.body.classList.add('playing');$('#play').textContent='Stop';$('#play').classList.remove('primary');if(current===frames.length-1&&frames.length>1)current=0;playTick()};$('#loop').onclick=()=>{loop=!loop;$('#loop').textContent=`Loop: ${loop?'On':'Off'}`;$('#loop').setAttribute('aria-pressed',String(loop));saveDraft()};$('#exportFrame').onclick=()=>{const a=document.createElement('a');a.href=frames[current].layers.reduce((url,c)=>url,frames[current].layers[0].toDataURL());a.download=`openflip-frame-${current+1}.png`;a.click()};
$('#addFrame').onclick=()=>{stopPlayback();frames.splice(current+1,0,newFrame());current++;render();saveDraft()};$('#duplicateFrame').onclick=()=>{stopPlayback();const f=newFrame();f.layers.forEach((c,i)=>c.getContext('2d').drawImage(frames[current].layers[i],0,0));f.soundId=frames[current].soundId;frames.splice(current+1,0,f);current++;render();saveDraft()};$('#clearFrame').onclick=()=>{snapshot();frames[current].layers.forEach(c=>c.getContext('2d').clearRect(0,0,W,H));render();saveDraft()};$('#deleteFrame').onclick=()=>{stopPlayback();if(frames.length===1)frames=[newFrame()];else frames.splice(current,1);current=Math.min(current,frames.length-1);render();saveDraft()};
function renderSounds(){const list=$('#soundList');list.replaceChildren();if(!sounds.length){list.textContent='No sounds saved yet.';return}for(const s of sounds){const row=document.createElement('div');row.className='sound-item';const name=document.createElement('strong');name.textContent=s.name;const preview=document.createElement('button');preview.textContent='Preview';preview.onclick=()=>new Audio(s.data).play().catch(()=>{});const attach=document.createElement('button');attach.textContent=frames[current].soundId===s.id?'Attached':'Attach to frame';attach.onclick=()=>{frames[current].soundId=s.id;saveDraft();render();renderSounds()};const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{if(!confirm(`Delete ${s.name} and detach it from frames?`))return;sounds=sounds.filter(x=>x.id!==s.id);frames.forEach(f=>{if(f.soundId===s.id)f.soundId=null});saveDraft();render();renderSounds()};row.append(name,preview,attach,del);list.append(row)}}
function addSound(name,data){sounds.push({id:uid(),name,data});renderSounds();saveDraft();status(`Added ${name}`)}$('#audioFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>addSound(f.name,r.result);r.readAsDataURL(f);e.target.value=''};
let recorder=null,chunks=[];$('#recordVoice').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status('Voice recording is not available in this browser.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const reader=new FileReader();reader.onload=()=>addSound(`Voice ${new Date().toLocaleString()}`,reader.result);reader.readAsDataURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));stream.getTracks().forEach(t=>t.stop());$('#recordVoice').disabled=false;$('#stopRecord').disabled=true;$('#recordStatus').textContent=''};recorder.start();$('#recordVoice').disabled=true;$('#stopRecord').disabled=false;$('#recordStatus').textContent='Recording…'}catch{status('Microphone access was not granted.')}};$('#stopRecord').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
const LIBRARY='openflip-library-v1',DRAFT='openflip-draft-v1';function projectData(){return{version:1,name:projectName,frames:frames.map(f=>({layers:f.layers.map(c=>c.toDataURL('image/png')),soundId:f.soundId})),sounds,selectedFrame:current,loop}}
function library(){try{return JSON.parse(localStorage.getItem(LIBRARY)||'[]')}catch{return[]}}function saveProject(){const name=prompt('Project name',projectName);if(name===null)return;projectName=name.trim()||'Untitled project';const all=library(),id=activeProjectId||uid(),p={...projectData(),id,updatedAt:Date.now()},at=all.findIndex(x=>x.id===id);if(at>=0)all[at]=p;else all.unshift(p);try{localStorage.setItem(LIBRARY,JSON.stringify(all));activeProjectId=id;saveDraft();status(`Saved “${projectName}” to your library.`)}catch{status('Storage is full. Export the project to keep a backup.')}}let activeProjectId=null;
function fromImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url})}async function loadProject(p){stopPlayback();try{const fs=[];for(const item of p.frames){const f=newFrame();for(let i=0;i<Math.min(2,item.layers.length);i++){const im=await fromImage(item.layers[i]);f.layers[i].getContext('2d').drawImage(im,0,0,W,H)}f.soundId=item.soundId||null;fs.push(f)}frames=fs.length?fs:[newFrame()];sounds=Array.isArray(p.sounds)?p.sounds:[];current=Math.min(p.selectedFrame||0,frames.length-1);projectName=p.name||'Untitled project';activeProjectId=p.id||null;loop=!!p.loop;$('#loop').textContent=`Loop: ${loop?'On':'Off'}`;$('#loop').setAttribute('aria-pressed',String(loop));renderSounds();render();saveDraft();status(`Opened “${projectName}”.`);$('#libraryModal').hidden=true}catch{status('Could not open that project.')}}
function renderLibrary(){const list=$('#libraryList');list.replaceChildren();const all=library().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));if(!all.length){list.textContent='Your library is empty. Save a project to keep it here.';return}for(const p of all){const row=document.createElement('div');row.className='project-item';const n=document.createElement('strong');n.textContent=p.name||'Untitled project';const date=document.createElement('span');date.className='hint';date.textContent=p.updatedAt?new Date(p.updatedAt).toLocaleString():'';const open=document.createElement('button');open.textContent='Open';open.onclick=()=>loadProject(p);const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{if(!confirm(`Delete ${p.name||'this project'}?`))return;localStorage.setItem(LIBRARY,JSON.stringify(library().filter(x=>x.id!==p.id)));renderLibrary()};row.append(n,date,open,del);list.append(row)}}
$('#saveProject').onclick=saveProject;$('#openLibrary').onclick=()=>{renderLibrary();$('#libraryModal').hidden=false};$('#closeLibrary').onclick=()=>$('#libraryModal').hidden=true;$('#libraryModal').onclick=e=>{if(e.target.id==='libraryModal')e.currentTarget.hidden=true};$('#newProject').onclick=()=>{if(!confirm('Start a new project? Save this project first to keep it in your library.'))return;stopPlayback();frames=[newFrame()];sounds=[];current=0;projectName='Untitled project';activeProjectId=null;undoStack=[];renderSounds();render();saveDraft();status('New project created.')};
$('#downloadProject').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(projectData())],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`${projectName.replace(/[^a-z0-9-_]+/gi,'-')||'openflip'}.json`;a.click();URL.revokeObjectURL(url)};$('#importProject').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await loadProject(JSON.parse(await f.text()))}catch{status('Invalid project file.')}e.target.value=''};
async function restoreDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT)||'null');if(d?.frames?.length)await loadProject(d)}catch{status('Could not restore the previous draft.')}}
renderSounds();render();restoreDraft();
</script></body></html>
